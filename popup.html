<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 16px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #1f2937;
        }

        h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 12px;
            font-size: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }

        #output {
            margin-top: 12px;
            padding: 10px 12px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            color: #0f172a;
            word-break: break-all;
            min-height: 18px;
        }

        #output:empty::before {
            content: "Encoded link will appear here...";
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <h3>Go Link Encoder</h3>
    <input id="urlInput" type="text" placeholder="Paste URL to compress..." />
    <button id="encodeBtn">Encode & Copy</button>
    <div id="output"></div>

    <script type="module" src="popup.js"></script>
</body>
</html>
